name: deploy to GitHub Pages
# Publishes the game (no build step: index.html, the scripts and the vendored Three.js) so it can be opened on a phone.
# One-time setup: repository Settings > Pages > Build and deployment > Source: GitHub Actions.
on:
  push:
    branches: [main, claude/modest-carson-oebyjg]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage the site (only what the game loads, not tests or tools)
        run: |
          mkdir _site
          cp index.html *.js _site/
          cp -r vendor _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
